<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta

      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e1116" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230e1116'/%3E%3Cpath d='M13 28h6l-1-16h-4z' fill='%238a8f92'/%3E%3Ccircle cx='16' cy='9' r='3' fill='%23ffa95a'/%3E%3C/svg%3E"
    />
    <title>雾灯</title>
    <!--
      batch26：structuredClone 全局 polyfill（Safari 15.0–15.3 没有，15.4 才有）。普通内联脚本，在所有 type="module"（含 three / vendor 分包）之前执行；
      有原生不覆盖。只拷数据：普通对象 / 数组 / Date / Map / Set / 环引用，与 src/platform/clone.ts 的 cloneFallback 同口径（npm run test:save 比对）。
    -->
    <script id="polyfill-structured-clone">
      (function (g) {
        if (typeof g.structuredClone === 'function') return;
        function c(v, seen) {
          if (v === null || typeof v !== 'object') return v;
          if (seen.has(v)) return seen.get(v);
          var o, i, k;
          if (v instanceof Date) return new Date(v.getTime());
          if (Array.isArray(v)) {
            o = [];
            seen.set(v, o);
            for (i = 0; i < v.length; i++) o.push(c(v[i], seen));
            return o;
          }
          if (v instanceof Map) {
            o = new Map();
            seen.set(v, o);
            v.forEach(function (x, key) { o.set(c(key, seen), c(x, seen)); });
            return o;
          }
          if (v instanceof Set) {
            o = new Set();
            seen.set(v, o);
            v.forEach(function (x) { o.add(c(x, seen)); });
            return o;
          }
          o = {};
          seen.set(v, o);
          k = Object.keys(v);
          for (i = 0; i < k.length; i++) o[k[i]] = c(v[k[i]], seen);
          return o;
        }
        Object.defineProperty(g, 'structuredClone', {
          value: function structuredClone(v) { return c(v, new Map()); },
          writable: true,
          configurable: true,
          enumerable: false,
        });
      })(window);
    </script>
  </head>
  <body>
    <div id="app">
      <div id="ui-root"></div>
    </div>
    <noscript>需要启用 JavaScript 才能运行游戏。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
