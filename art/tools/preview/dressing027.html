<!doctype html>
<!-- 道具预览：冷色阴天 + 三渲二（MeshToonMaterial + COLOR_0 平滑法线外扩描边）。由 ../render-preview-web.mjs 驱动。
     参数：?view=lantern | stand | stand-back | bell | bell-side | bell-scale | raft | raft-float | raft-top
           | mirror | mirror-back | guide-a | guide-b | gate | gate-open | gate-dials（021 / 022 解谜道具，2026-10-30）
           | lock | lock-lit | valve | valve-open | window | window-side | ignite | ignite-pulled | ignite-below | door | door-open | door-key（10-30 第 3 批）
     潮汐钟（mat-prop-tide-bell，extras.wetMetal）：toon 三阶 + 近似阶梯冷高光（雾白偏青，按 ORM 金属度遮罩），只为预览 023 的湿铜效果 -->
<html><head><!-- 027 剧情物件 / 场景小物预览：dressing027.html?view=lineup|reading|notice|kitchen|desk|dressing|seabird|lods。照搬 index.html 的灯光 / 三渲二 / 描边设置。 --><meta charset="utf-8"><style>html,body{margin:0;background:#8FA0AE;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';

const view = new URLSearchParams(location.search).get('view') ?? 'lantern';
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.AgXToneMapping; renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#8FA0AE');
scene.fog = new THREE.Fog('#8FA0AE', 4, 14);
scene.add(new THREE.HemisphereLight('#A9B8C4', '#4A535A', 1.7));
const sun = new THREE.DirectionalLight('#C9D6E0', 1.1);
sun.position.set(2.5, 4, 3); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -1.5, right: 1.5, top: 1.5, bottom: -1.5, near: 0.1, far: 10 }); sun.shadow.radius = 6;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshToonMaterial({ color: '#5E6870' }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const ramp = new THREE.DataTexture(new Uint8Array([70, 70, 70, 255, 150, 150, 150, 255, 255, 255, 255, 255]), 3, 1);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;

const outlineMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: { px: { value: 1.6 }, res: { value: new THREE.Vector2(W, H) }, color: { value: new THREE.Color('#2A2F36') } },
  vertexShader: `attribute vec4 color; uniform float px; uniform vec2 res;
    void main(){ vec3 n = color.xyz*2.0-1.0; vec4 c = projectionMatrix*modelViewMatrix*vec4(position,1.0);
      vec3 nv = normalize(normalMatrix*n); vec2 d = length(nv.xy)>1e-4 ? normalize(nv.xy) : vec2(0.0);
      c.xy += d*px*2.0/res*c.w; gl_Position = c; }`,
  fragmentShader: `uniform vec3 color; void main(){ gl_FragColor = vec4(color,1.0); }`,
});

function prepare(root) {
  const extra = [];
  root.traverse((o) => {
    if (!o.isMesh) return;
    const m = o.material;
    if (m.name === 'mat-prop-dressing-ch1') {
      o.material = new THREE.MeshToonMaterial({ name: m.name, map: m.map, normalMap: m.normalMap, aoMap: m.aoMap, gradientMap: ramp });
      o.castShadow = o.receiveShadow = true;
      // 游戏里描边只来自交互高亮（Highlight.ts），海鸟不可交互 → 带 morph 的网格不描边
      if (o.geometry.attributes.color && !o.geometry.morphAttributes.position) { const ol = new THREE.Mesh(o.geometry, outlineMat); ol.name = o.name + '-outline'; ol.morphTargetInfluences = o.morphTargetInfluences; extra.push([o, ol]); }
    } else if (m.name === 'mat-env-vegetation-ch1') {
      o.material = new THREE.MeshToonMaterial({ name: m.name, map: m.map, gradientMap: ramp, alphaTest: 0.5, side: THREE.DoubleSide });
      o.castShadow = true; o.receiveShadow = true;
    }
  });
  for (const [o, ol] of extra) o.add(ol);
}
function showLod(root, lv = 0) { root.traverse((o) => { const m = /_lod(\d)$/.exec(o.name); if (m) o.visible = +m[1] === lv; }); }
const ktx2 = new KTX2Loader().setTranscoderPath('/three/examples/jsm/libs/basis/').detectSupport(renderer);
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).setKTX2Loader(ktx2);
const loadG = (u) => new Promise((ok, err) => loader.load(u, ok, undefined, err));
const P = async (name, x = 0, y = 0, z = 0, ry = 0, lv = 0, dir = 'props') => { const g = await loadG(`/models/${dir}/${name}.glb`); const s = g.scene; prepare(s); showLod(s, lv); s.position.set(x, y, z); s.rotation.y = ry; scene.add(s); return s; };
const hide = (s, n) => s.traverse((o) => { if (o.name === n) o.visible = false; });
const tex = (u) => new Promise((ok, err) => ktx2.load(u, ok, undefined, err));
const shadowBox = (l, r, t, b) => { Object.assign(sun.shadow.camera, { left: l, right: r, top: t, bottom: b }); sun.shadow.camera.updateProjectionMatrix(); };
const slab = (w, d, h, col, x = 0, z = 0) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshToonMaterial({ color: col, gradientMap: ramp })); m.position.set(x, -h / 2, z); m.receiveShadow = true; scene.add(m); return m; };
const label = (txt, x, y, z, s = 0.05) => { const c = document.createElement('canvas'); c.width = 768; c.height = 96; const g = c.getContext('2d'); g.fillStyle = '#20262c'; g.font = '44px sans-serif'; g.fillText(txt, 6, 64);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthTest: false, fog: false })); sp.center.set(0, 0.5); sp.scale.set(s * 8, s, 1); sp.position.set(x, y, z); scene.add(sp); return sp; };
const cam = new THREE.PerspectiveCamera(30, W / H, 0.01, 200);
const look = (px, py, pz, ax, ay, az, fov = 30) => { cam.fov = fov; cam.position.set(px, py, pz); cam.updateProjectionMatrix(); cam.lookAt(ax, ay, az); };
const morph = (s, a, b) => s.traverse((o) => { if (o.morphTargetInfluences) { o.morphTargetInfluences[0] = a; o.morphTargetInfluences[1] = b; } });
try {
  if (view === 'lineup') {
    shadowBox(-4, 4, 3, -3);
    for (const [n, x] of [['prop-barrel-a', -1.6], ['prop-crate-a', -0.75], ['prop-net-pile-a', 0.35], ['prop-buoy-a', 1.25], ['prop-rope-coil-a', 1.85]]) await P(n, x, 0, -0.6, 0.3);
    await P('prop-notice-board-s1', -2.9, 0, -0.9, 0.35);
    for (const [n, x, ry] of [['prop-kitchen-set-a', -1.4, 0.2], ['prop-desk-set-a', -0.1, -0.3], ['prop-journal-father', 0.75, 0.0], ['prop-logbook-s3', 1.2, 0], ['prop-cup-tin', 1.5, 0.1], ['prop-sketch-window', 1.85, 0.0], ['prop-letter-a', 2.2, 0], ['prop-letter-b', 2.45, 0.05], ['prop-letter-c', 2.65, 0.1]]) { const s = await P(n, x, 0, 0.55, ry); if (n === 'prop-journal-father') hide(s, 'prop-journal-father-open_lod0'); }
    for (let i = 0; i < 6; i++) await P('env-grass-coastal-a', 2.6 + (i % 3) * 0.3, 0, -0.8 + Math.floor(i / 3) * 0.35, i, 0, 'env');
    await P('env-seaweed-a', 3.3, 0, -0.2, 0.5, 0, 'env');
    const b = await P('prop-seabird-far', -0.2, 1.9, -1.4, -0.6); morph(b, 0.6, 0);
    look(0.3, 2.3, 5.2, 0.3, 0.35, -0.2, 34);
  } else if (view === 'reading') {
    slab(1.6, 0.9, 0.04, '#5b5650'); shadowBox(-1, 1, 1, -1);
    hide(await P('prop-journal-father', -0.5, 0, -0.15, 0), 'prop-journal-father-open_lod0');
    hide(await P('prop-journal-father', -0.05, 0, -0.15, 0), 'prop-journal-father-closed_lod0');
    await P('prop-logbook-s3', 0.45, 0, -0.15, 0.2);
    await P('prop-letter-a', -0.55, 0, 0.25, 0.1); await P('prop-letter-b', -0.25, 0, 0.27, -0.15); await P('prop-letter-c', 0.0, 0, 0.27, 0.3);
    await P('prop-sketch-window', 0.35, 0, 0.25, -0.08);
    label('journal 合 / 开', -0.62, 0.06, -0.4, 0.035); label('logbook-s3', 0.33, 0.06, -0.4, 0.035); label('letter a / b / c', -0.66, 0.05, 0.47, 0.035); label('sketch', 0.27, 0.05, 0.47, 0.035);
    look(0, 1.25, 0.95, 0, 0, 0.02, 34);
  } else if (view === 'notice') {
    slab(2.4, 1.2, 0.08, '#5f5b54'); shadowBox(-1.5, 1.5, 2, -0.5);
    await P('prop-notice-board-s1', 0, 0, 0, 0);
    look(0.7, 1.45, 2.1, -0.05, 1.05, 0, 32);
  } else if (view === 'kitchen') {
    slab(1.3, 0.8, 0.05, '#5b5650'); shadowBox(-1, 1, 1, -1);
    await P('prop-kitchen-set-a');
    await P('prop-cup-tin', 0.0, 0, 0.0, 0.4);
    const c2 = await P('prop-cup-tin', 0.1, 0.085, 0.05, 1.2); c2.rotation.x = Math.PI;
    look(0.35, 0.95, 1.05, -0.02, 0.02, 0.0, 36);
  } else if (view === 'desk') {
    slab(0.6, 1.1, 0.04, '#5b5650'); shadowBox(-1, 1, 1, -1);
    await P('prop-desk-set-a');
    hide(await P('prop-journal-father', 0.1, 0, 0.32, 0), 'prop-journal-father-open_lod0');
    await P('prop-letter-c', -0.05, 0.005, -0.38, 0.3);
    const lan = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.28, 16), new THREE.MeshBasicMaterial({ color: '#B8C3CC', wireframe: true })); lan.position.set(0.05, 0.14, -0.05); scene.add(lan);
    label('lanternSocket（022）', 0.1, 0.33, -0.05, 0.03);
    look(0.95, 1.0, 0.25, -0.02, 0.02, -0.05, 40);
  } else if (view === 'dressing') {
    shadowBox(-3, 3, 3, -3); ground.material.color.set('#8F877A');
    const fp = await tex('/textures/tex-decal-footprints-albedo.ktx2'); fp.colorSpace = THREE.SRGBColorSpace;
    const dec = new THREE.Mesh(new THREE.PlaneGeometry(1, 2), new THREE.MeshToonMaterial({ map: fp, transparent: true, depthWrite: false, gradientMap: ramp, polygonOffset: true, polygonOffsetFactor: -1 }));
    dec.rotation.x = -Math.PI / 2; dec.rotation.z = 0.25; dec.position.set(0.2, 0.003, 0.9); dec.receiveShadow = true; scene.add(dec);
    await P('prop-barrel-a', -1.3, 0, -0.6, 0.2); await P('prop-crate-a', -0.6, 0, -0.9, 0.4); await P('prop-crate-a', -0.65, 0.42, -0.85, 0.1);
    await P('prop-net-pile-a', 0.6, 0, -0.8, -0.3); await P('prop-buoy-a', 1.25, 0, -0.35, 0); await P('prop-rope-coil-a', -0.9, 0, 0.2, 0.7);
    let sd = 7; const r = () => ((sd = (sd * 16807) % 2147483647) / 2147483647);
    for (let i = 0; i < 26; i++) await P('env-grass-coastal-a', 1.0 + r() * 2.0, 0, -1.6 + r() * 2.2, r() * 6, 0, 'env');
    for (let i = 0; i < 6; i++) await P('env-seaweed-a', -2.2 + r() * 0.9, 0, 0.2 + r() * 1.2, r() * 6, 0, 'env');
    look(0.2, 1.9, 3.6, 0.0, 0.1, -0.2, 40);
  } else if (view === 'seabird') {
    ground.visible = false; shadowBox(-2, 2, 2, -2);
    const poses = [[1, 0], [0, 0], [0, 1]];
    for (let i = 0; i < 3; i++) { const b = await P('prop-seabird-far', -1.3 + i * 1.3, 0.6, 0, 0); b.rotation.x = 0.5; morph(b, ...poses[i]); }
    for (let lv = 0; lv < 3; lv++) { const b = await P('prop-seabird-far', -1.3 + lv * 1.3, -0.4, 0, 0, lv); b.rotation.x = 0.5; }
    label('flap-up / 平 / flap-down', -1.9, 1.05, 0, 0.09); label('LOD0 / LOD1 / LOD2', -1.9, 0.05, 0, 0.09);
    look(0, 0.4, 4.6, 0, 0.15, 0, 34);
  } else if (view === 'lods') {
    shadowBox(-3, 3, 3, -6);
    let z = -4.5;
    for (const [n, w] of [['prop-journal-father', 0.6], ['prop-notice-board-s1', 1.2], ['prop-kitchen-set-a', 1.2], ['prop-desk-set-a', 1.3], ['prop-barrel-a', 0.7], ['prop-rope-coil-a', 0.7], ['prop-net-pile-a', 1.0], ['prop-crate-a', 0.7], ['prop-buoy-a', 0.5]]) {
      for (let lv = 0; lv < 3; lv++) { const s = await P(n, -1.6 + lv * 1.6, 0, z, 0.4, lv); if (n === 'prop-journal-father') hide(s, 'prop-journal-father-closed_lod' + lv); }
      z += w; }
    look(0, 6.5, 6.0, 0, 0, -1.2, 40);
  } else throw new Error('未知 view ' + view);
  scene.updateMatrixWorld(true); renderer.render(scene, cam);
  document.title = 'done';
} catch (e) { document.title = 'error: ' + e.message; document.body.insertAdjacentText('beforeend', String(e.stack)); }
</script></body></html>
