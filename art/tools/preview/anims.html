    for (let k = 0; k < n; k++) { pose(name, k / 30); tile(k % cols, Math.floor(k / cols), cols, rows, view); }
  } else {
    const FR = Q.get('frames')?.split(',').map(Number);   // frames=14,22,25 → 只画这几帧
    const names = Q.get('clips').split(','), n = FR ? FR.length : +(Q.get('n') ?? 8), views = (Q.get('views') ?? 'side').split(',');
    const rows = names.length * views.length; let j = 0;
    for (const name of names) for (const view of views) {
      const m = meta.clips[name], dur = (m.frames - 1) / 30;
      for (let k = 0; k < n; k++) { const t = FR ? FR[k] / 30 : m.loop ? (dur * k) / n : (dur * k) / (n - 1); pose(name, t); tile(k, j, n, rows, view); }
      j++;
    }
  }
  document.title = 'done';
} catch (e) { document.title = 'error: ' + e.message; document.body.insertAdjacentText('beforeend', String(e.stack)); }
</script></body></html>
