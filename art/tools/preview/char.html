<!doctype html>
<!-- 主角汐预览：冷色阴天 + 三渲二（MeshToonMaterial 两阶明暗 + COLOR_0 平滑法线外扩描边，支持蒙皮）。
     由 ../render-preview-web.mjs --char 驱动。?view=front | side | back | lantern | face | lods -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#8FA0AE;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';

const view = new URLSearchParams(location.search).get('view') ?? 'front';
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.AgXToneMapping; renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#8FA0AE');
scene.fog = new THREE.Fog('#8FA0AE', 6, 18);
scene.add(new THREE.HemisphereLight('#A9B8C4', '#4A535A', 1.7));
const sun = new THREE.DirectionalLight('#C9D6E0', 1.1);
sun.position.set(2.0, 4, 3); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.01;
Object.assign(sun.shadow.camera, { left: -2.5, right: 2.5, top: 2.5, bottom: -1, near: 0.1, far: 12 }); sun.shadow.radius = 5;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshToonMaterial({ color: '#5E6870' }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const mkRamp = (vals) => { const d = new Uint8Array(vals.flatMap((v) => [v, v, v, 255])); const t = new THREE.DataTexture(d, vals.length, 1); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; };
const ramp2 = mkRamp([150, 255]);       // 角色两阶明暗
const rampFace = mkRamp([222, 255]);    // 脸：暗部很浅（正式版用 SDF 面部阴影图）
const ramp3 = mkRamp([70, 150, 255]);   // 道具

const outlineMat = (px) => new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: { px: { value: px }, res: { value: new THREE.Vector2(W, H) }, color: { value: new THREE.Color('#2A2F36') } },
  vertexShader: `#include <common>
    #include <skinning_pars_vertex>
    attribute vec4 color; uniform float px; uniform vec2 res;
    void main(){
      vec3 objectNormal = color.xyz*2.0-1.0; vec3 transformed = position;
      #include <skinbase_vertex>
      #include <skinnormal_vertex>
      #include <skinning_vertex>
      vec4 c = projectionMatrix*modelViewMatrix*vec4(transformed,1.0);
      vec3 nv = normalize(normalMatrix*objectNormal); vec2 d = length(nv.xy)>1e-4 ? normalize(nv.xy) : vec2(0.0);
      c.xy += d*px*2.0/res*c.w; gl_Position = c; }`,
  fragmentShader: `uniform vec3 color; void main(){ gl_FragColor = vec4(color,1.0); }`,
});

function prepare(root, px = 1.6) {
  const extra = [];
  root.traverse((o) => {
    if (/-collider$/.test(o.name)) { o.visible = false; return; }
    if (!o.isMesh) return;
    const m = o.material;
    if (m.name === 'mat-prop-lantern-glow') { m.vertexColors = false; m.emissiveIntensity = 2.2; m.depthWrite = false; return; }
    const gm = m.name === 'mat-char-xi-face' ? rampFace : m.name.startsWith('mat-char') ? ramp2 : ramp3;
    o.material = new THREE.MeshToonMaterial({ name: m.name, map: m.map, normalMap: m.normalMap, gradientMap: gm });
    o.castShadow = o.receiveShadow = true;
    const ol = o.isSkinnedMesh ? new THREE.SkinnedMesh(o.geometry, outlineMat(px)) : new THREE.Mesh(o.geometry, outlineMat(px));
    ol.name = o.name + '-outline'; ol.frustumCulled = false; o.frustumCulled = false; extra.push([o, ol]);
  });
  for (const [o, ol] of extra) { o.parent.add(ol); if (o.isSkinnedMesh) ol.bind(o.skeleton, o.bindMatrix); else { ol.position.copy(o.position); ol.quaternion.copy(o.quaternion); ol.scale.copy(o.scale); } }
}
// 脸：按 023 约定用 SDF 面部阴影图做干净的两阶明暗（TEXCOORD_1 = uv1）。lit = θ <= sdf；光从角色左侧来时 u 翻转。
let sdfTex = null;
function faceSDF(root, restHead) {
  const head = root.getObjectByName('head'); if (!head || !sdfTex) return;
  const dq = head.getWorldQuaternion(new THREE.Quaternion()).multiply(restHead.clone().invert());
  const fwd = new THREE.Vector3(0, 0, 1).applyQuaternion(dq), right = new THREE.Vector3(-1, 0, 0).applyQuaternion(dq);
  const L = sun.position.clone().normalize(); const f = L.dot(fwd), r = L.dot(right);
  const theta = Math.min(1, Math.max(0, Math.atan2(Math.abs(r), f) / (Math.PI / 2)));
  root.traverse((o) => {
    if (!o.isMesh || o.material.name !== 'mat-char-xi-face') return;
    const m = new THREE.MeshBasicMaterial({ name: o.material.name, map: o.material.map, lightMap: sdfTex });
    m.onBeforeCompile = (sh) => {
      sh.uniforms.uTheta = { value: theta }; sh.uniforms.uFlip = { value: r < 0 ? 1 : 0 };
      sh.fragmentShader = sh.fragmentShader.replace('#include <lightmap_pars_fragment>', '#include <lightmap_pars_fragment>\nuniform float uTheta; uniform float uFlip;')
        .replace(/vec4 lightMapTexel = texture2D\( lightMap, vLightMapUv \);\s*reflectedLight\.indirectDiffuse \+= [^;]*;/,
          `vec2 suv = vLightMapUv; if (uFlip > 0.5) suv.x = 1.0 - suv.x;
           float sdfv = texture2D(lightMap, suv).r;
           float lit = smoothstep(uTheta - 0.015, uTheta + 0.015, sdfv);
           reflectedLight.indirectDiffuse += mix(vec3(0.76, 0.68, 0.72), vec3(0.97), lit);`);
    };
    o.material = m;
  });
}
const showLod = (root, lv) => root.traverse((o) => { const m = /_lod(\d)$/.exec(o.name); if (m) o.visible = +m[1] === lv; });

// 安静、内敛的提灯待机姿势（骨骼绑定时旋转都是单位矩阵，这里直接在父空间里转）
function quietPose(c) {
  const b = (n) => c.getObjectByName(n);
  // 骨骼有朝向（不是全单位旋转）：姿势角度按“骨骼静止时的世界轴”给出（与旧版单位骨架时的写法等价）。
  //   q_local' = Op⁻¹ · e · Op · q_local，Op = 父骨骼静止世界朝向。必须在任何改动之前记录静止朝向。
  c.updateMatrixWorld(true);
  const rest = new Map(); c.traverse((o) => rest.set(o, o.getWorldQuaternion(new THREE.Quaternion())));
  const conj = (n, e) => { const o = b(n), Op = rest.get(o.parent) ?? new THREE.Quaternion(); o.quaternion.premultiply(Op.clone().invert().multiply(e).multiply(Op)); };
  const E = (n, x, y, z) => conj(n, new THREE.Quaternion().setFromEuler(new THREE.Euler(x, y, z)));
  const aim = (n, from, to) => conj(n, new THREE.Quaternion().setFromUnitVectors(from.clone().normalize(), to.clone().normalize()));
  { const h = b('hips'), Op = rest.get(h.parent); h.position.add(new THREE.Vector3(0.018, 0, 0).applyQuaternion(Op.clone().invert())); } E('hips', 0, 0.05, -0.035);         // 重心落在左腿
  E('thigh_l', 0, 0, 0.035); E('thigh_r', -0.1, 0, 0.02); E('calf_r', 0.2, 0, 0); E('foot_r', -0.08, 0, 0);
  E('spine_01', 0.03, 0, 0.02); E('spine_02', 0.04, 0, 0.01); E('chest', 0.05, -0.03, 0.01);
  E('shoulder_l', 0, -0.13, -0.05); E('shoulder_r', 0, 0.13, 0.05); // 肩膀内收
  E('neck', 0.1, 0, 0); E('head', 0.24, -0.08, 0.06);               // 低头、视线往下、略侧
  const s = Math.SQRT1_2;
  aim('upper_arm_r', new THREE.Vector3(-s, -s, 0), new THREE.Vector3(-0.27, -1, 0.05)); E('lower_arm_r', -0.1, 0, 0.06);   // 手臂要略张开才能落在宽大的雨衣外面
  aim('upper_arm_l', new THREE.Vector3(s, -s, 0), new THREE.Vector3(0.24, -1, 0.16)); E('lower_arm_l', -0.5, 0.1, 0);
  for (const f of ['index', 'middle', 'ring', 'pinky']) { E(`${f}_01_r`, 0, 0, 1.0); E(`${f}_02_r`, 0, 0, 1.1); E(`${f}_03_r`, 0, 0, 0.7); E(`${f}_01_l`, 0, 0, -0.35); E(`${f}_02_l`, 0, 0, -0.4); }
  E('thumb_01_r', 0.35, 0, 0.25); E('thumb_02_r', 0, 0, 0.4);
  E('hair_ponytail_01', 0.15, 0, 0);
}

const ktx2 = new KTX2Loader().setTranscoderPath('/three/examples/jsm/libs/basis/').detectSupport(renderer);
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).setKTX2Loader(ktx2);
const load = (u) => new Promise((ok, err) => loader.load(u, (g) => ok(g.scene), undefined, err));
try {
  const cam = new THREE.PerspectiveCamera(22, W / H, 0.05, 60);
  const look = (pos, tgt) => { cam.position.copy(pos); cam.lookAt(tgt); };
  if (view === 'lods') {
    for (let i = 0; i < 3; i++) {
      const c = await load('/models/characters/char-xi.glb'); prepare(c); showLod(c, i); c.position.x = (i - 1) * 1.15; scene.add(c);
    }
    look(new THREE.Vector3(0, 0.85, 7.4), new THREE.Vector3(0, 0.76, 0));
  } else {
    const c = await load('/models/characters/char-xi.glb');
    prepare(c, view === 'face' ? 2.2 : 1.6); showLod(c, 0); scene.add(c);
    c.updateMatrixWorld(true); const restHead = c.getObjectByName('head').getWorldQuaternion(new THREE.Quaternion());
    sdfTex = await new Promise((ok, err) => ktx2.load('/textures/tex-xi-sdf-face.ktx2', ok, undefined, err));
    sdfTex.colorSpace = THREE.NoColorSpace; sdfTex.channel = 1; sdfTex.flipY = false;
    if (view === 'front') look(new THREE.Vector3(0, 0.8, 4.4), new THREE.Vector3(0, 0.76, 0));
    if (view === 'side') look(new THREE.Vector3(4.4, 0.8, 0), new THREE.Vector3(0, 0.76, 0));
    if (view === 'back') look(new THREE.Vector3(0, 0.8, -4.4), new THREE.Vector3(0, 0.76, 0));
    if (view === 'face') { cam.fov = 18; cam.updateProjectionMatrix(); look(new THREE.Vector3(0.12, 1.38, 0.95), new THREE.Vector3(0, 1.36, 0)); }
    if (view === 'lantern') {
      quietPose(c);
      const lantern = await load('/models/props/prop-lantern-brass.glb'); prepare(lantern);
      c.getObjectByName('hand_r_socket').add(lantern);
      const warm = new THREE.PointLight('#E8A24A', 0.05, 1.2, 2);
      lantern.getObjectByName('prop-lantern-brass-emitter').add(warm);
      look(new THREE.Vector3(-1.7, 0.95, 3.9), new THREE.Vector3(-0.05, 0.74, 0));
    }
    globalThis.__face = () => faceSDF(c, restHead);
  }
  scene.updateMatrixWorld(true);
  if (globalThis.__face) globalThis.__face();
  renderer.render(scene, cam);
  document.title = 'done';
} catch (e) { document.title = 'error: ' + e.message; document.body.insertAdjacentText('beforeend', String(e.stack)); }
</script></body></html>
