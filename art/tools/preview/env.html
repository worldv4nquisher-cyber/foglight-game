<!-- S1 落潮滩组装预览（018）：按 art/source/env/s1-layout.json 摆放全部大件 + 礁石实例。
     冷色阴天、指数雾 + 雾片、天空渐变云、Reflector 水面（水位可调）、场景 3 阶明暗、深度描边后处理、冷调色 + 暗角 + 颗粒。
     由 ../render-preview-web.mjs --env 驱动。?view=opening | opening-low | overview | channel | ledge | assets  &tide=1.6 &rope=high|low|both（默认按潮位） -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#9AA3AB;overflow:hidden;font:12px/1.2 sans-serif}
.lbl{position:absolute;color:#1d2328;background:rgba(220,225,228,.82);padding:2px 5px;border-radius:3px;white-space:nowrap;transform:translate(-50%,-120%)}
.lbl:after{content:'';position:absolute;left:50%;bottom:-5px;border:4px solid transparent;border-top-color:rgba(220,225,228,.82)}
#cap{position:absolute;left:10px;bottom:8px;color:#e8ecee;text-shadow:0 1px 2px #000;font-size:13px}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head><body><div id="cap"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

const Q = new URLSearchParams(location.search);
const view = Q.get('view') ?? 'opening';
const TIDE = Q.has('tide') ? +Q.get('tide') : view === 'opening' || view === 'ledge' ? 1.6 : view === 'channel' ? 0.0 : 0.0;
const SS = view === 'assets' || view === 'rocks' || view === 'overview' ? 1.5 : 2; // 超采样
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.AgXToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const FOG = new THREE.Color('#B9C2C8');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(FOG, view === 'assets' || view === 'rocks' ? 0.004 : view === 'overview' ? 0.006 : 0.009);
// 028：?atmo=028 → 天空云层 / 雾墙 / 岛边地面雾 / 水面法线 + 雨圈 / 泡沫 / 雨 / LUT（参数 art/source/atmosphere/atmosphere-028.json）；?rain=naive|current 只加雨（对比用）
const ATMO = Q.get('atmo') === '028';
const AM = ATMO || Q.has('rain') ? await import('./atmo028.js') : null;
const AT = AM ? await AM.loadAtmo(THREE, renderer, Q) : null;
if (ATMO) { FOG.set(AT.preset.fog.color); scene.fog.color.copy(FOG); if (view !== 'overview') scene.fog.density = AT.preset.fog.density; }

// ---------------- 灯光：只有冷色天光 + 云后漫射主光（没有任何环境暖光）
scene.add(new THREE.HemisphereLight('#AEBCC7', '#4B545B', 1.55));
const sun = new THREE.DirectionalLight('#CFD9E1', 0.95);
sun.position.set(30, 38, -22); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 140 });
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03; sun.shadow.radius = 4;
scene.add(sun); scene.add(sun.target);

// ---------------- 天空：渐变 + fbm 云 + 地平线残余天光（只在天边）
const sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color('#4A535B') }, mid: { value: new THREE.Color('#99A2AA') }, hor: { value: new THREE.Color('#C9D0D4') }, dusk: { value: new THREE.Color('#C9A88A') }, duskDir: { value: new THREE.Vector3(0.83, 0, -0.56).normalize() } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); vec4 p = projectionMatrix*modelViewMatrix*vec4(position,1.0); gl_Position = p.xyww; }`,
  fragmentShader: `varying vec3 vDir; uniform vec3 top, mid, hor, dusk, duskDir;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y); }
    float fbm(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<6;i++){ s+=a*n(p); p=p*2.03+vec2(1.7,9.2); a*=0.5; } return s; }
    void main(){
      vec3 d = normalize(vDir); float e = max(d.y, 0.0);
      vec3 c = mix(hor, mid, smoothstep(0.0, 0.18, e)); c = mix(c, top, smoothstep(0.18, 0.7, e));
      vec2 uv = d.xz / (d.y + 0.12) * 1.4;
      float cl = fbm(uv*0.9 + vec2(3.0, 1.0)); float cl2 = fbm(uv*2.3 + 7.0);
      float dark = smoothstep(0.45, 0.8, cl) * smoothstep(0.02, 0.25, e);
      c = mix(c, top*0.7, dark*0.8); c = mix(c, mix(hor, mid, 0.4)*1.08, smoothstep(0.55, 0.75, cl2)*0.35*smoothstep(0.03,0.3,e));
      float az = max(dot(normalize(vec3(d.x,0.0,d.z)), duskDir), 0.0);
      c = mix(c, dusk, pow(az, 6.0) * (1.0 - smoothstep(0.0, 0.1, e)) * 0.6 * (0.6 + 0.4*cl2));
      c = mix(c, hor, 1.0 - smoothstep(0.0, 0.05, e));
      gl_FragColor = vec4(c, 1.0); }`,
}));
sky.renderOrder = -10; sky.frustumCulled = false; scene.add(sky);
if (ATMO) { scene.remove(sky); scene.add(await AM.makeSky(THREE, AT)); }

// ---------------- 材质处理：3 阶直接光 + 潮线湿色带 + 关掉 COLOR_0（那是描边法线）
const U = { uWet: { value: 1.6 } };
const physChunk = THREE.ShaderChunk.lights_physical_pars_fragment.replace(
  'float dotNL = saturate( dot( geometryNormal, directLight.direction ) );',
  'float dotNL = saturate( dot( geometryNormal, directLight.direction ) ); dotNL = smoothstep(0.02,0.1,dotNL)*0.42 + smoothstep(0.38,0.5,dotNL)*0.58;');
function patchMaterial(m, ud) {
  m.vertexColors = false;
  const wetDark = ud.wetDarken ?? 0.8, wetR = ud.wetRoughness ?? 0.3;
  m.onBeforeCompile = (sh) => {
    sh.uniforms.uWet = U.uWet;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying float vWY;').replace('#include <project_vertex>', `#include <project_vertex>
      { vec4 wp = vec4(transformed, 1.0);
      #ifdef USE_INSTANCING
        wp = instanceMatrix * wp;
      #endif
        vWY = (modelMatrix * wp).y; }`);
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying float vWY; uniform float uWet;')
      .replace('#include <map_fragment>', `#include <map_fragment>
        float wetK = 1.0 - smoothstep(uWet + ${(ud.wetOffset ?? 0).toFixed(2)} - 0.03, uWet + ${(ud.wetOffset ?? 0).toFixed(2)} + 0.06, vWY);
        diffuseColor.rgb *= mix(1.0, ${wetDark.toFixed(3)}, wetK);`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor = mix(roughnessFactor, min(roughnessFactor, ${(wetR + 0.32).toFixed(3)}), wetK);`)
      .replace('#include <lights_physical_pars_fragment>', physChunk);
  };
  m.customProgramCacheKey = () => `env-${wetDark}-${wetR}-${ud.wetOffset ?? 0}`;
  m.needsUpdate = true;
}
function applyMidFog(root, dens) {
  const done = new Map();
  root.traverse((o) => {
    if (!o.isMesh) return;
    const conv = (mt) => {
      if (done.has(mt)) return done.get(mt);
      const m2 = mt.clone(); m2.userData = { ...mt.userData };
      if (mt.name === 'mat-env-rock-shore') m2.color = m2.color.clone().multiplyScalar(0.62);
      const prev = mt.onBeforeCompile;
      m2.onBeforeCompile = (sh, r) => { prev?.call(m2, sh, r); sh.fragmentShader = sh.fragmentShader.replace('#include <fog_fragment>', `#ifdef USE_FOG
  float fogFactorMid = 1.0 - exp( - ${dens.toFixed(5)} * ${dens.toFixed(5)} * vFogDepth * vFogDepth );
  gl_FragColor.rgb = mix( gl_FragColor.rgb, fogColor, fogFactorMid );
#endif`); };
      const key = mt.customProgramCacheKey?.() ?? ''; m2.customProgramCacheKey = () => `${key}-mid${dens}-${mt.name}`;
      m2.needsUpdate = true; done.set(mt, m2); return m2;
    };
    o.material = Array.isArray(o.material) ? o.material.map(conv) : conv(o.material);
  });
}
function prepare(root, opt = {}) {
  root.traverse((o) => {
    if (/-(collider|wall)$/.test(o.name)) { o.visible = false; return; }
    const m = /_lod(\d)$/.exec(o.name); if (m) o.visible = +m[1] === (opt.lod ?? 0);
    if (!o.isMesh) return;
    o.castShadow = opt.cast ?? true; o.receiveShadow = true;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const mt of mats) {
      if (mt.userData.__p) continue; mt.userData.__p = true;
      if (mt.name === 'mat-env-silhouette-far') { o.material = new THREE.MeshBasicMaterial({ color: new THREE.Color('#56616B').lerp(FOG, 0.38), fog: false }); o.castShadow = false; continue; }
      if (mt.name === 'mat-prop-lantern-glow') { mt.vertexColors = false; mt.emissiveIntensity = 3; continue; }
      if (mt.map) mt.map.anisotropy = 8;
      if (mt.name === 'mat-env-net') { mt.alphaTest = 0; mt.alphaHash = true; } // 见材质 extras.alphaHint
      patchMaterial(mt, mt.userData);
    }
  });
  return root;
}

// 与 char.html 相同的安静提灯姿势
function quietPose(c) {
  const b = (n) => c.getObjectByName(n);
  // 骨骼有朝向（不是全单位旋转）：姿势角度按“骨骼静止时的世界轴”给出（与旧版单位骨架时的写法等价）。
  //   q_local' = Op⁻¹ · e · Op · q_local，Op = 父骨骼静止世界朝向。必须在任何改动之前记录静止朝向。
  c.updateMatrixWorld(true);
  const rest = new Map(); c.traverse((o) => rest.set(o, o.getWorldQuaternion(new THREE.Quaternion())));
  const conj = (n, e) => { const o = b(n), Op = rest.get(o.parent) ?? new THREE.Quaternion(); o.quaternion.premultiply(Op.clone().invert().multiply(e).multiply(Op)); };
  const E = (n, x, y, z) => conj(n, new THREE.Quaternion().setFromEuler(new THREE.Euler(x, y, z)));
  const aim = (n, from, to) => conj(n, new THREE.Quaternion().setFromUnitVectors(from.clone().normalize(), to.clone().normalize()));
  { const h = b('hips'), Op = rest.get(h.parent); h.position.add(new THREE.Vector3(0.018, 0, 0).applyQuaternion(Op.clone().invert())); } E('hips', 0, 0.05, -0.035);         // 重心落在左腿
  E('thigh_l', 0, 0, 0.035); E('thigh_r', -0.1, 0, 0.02); E('calf_r', 0.2, 0, 0); E('foot_r', -0.08, 0, 0);
  E('spine_01', 0.03, 0, 0.02); E('spine_02', 0.04, 0, 0.01); E('chest', 0.05, -0.03, 0.01);
  E('shoulder_l', 0, -0.13, -0.05); E('shoulder_r', 0, 0.13, 0.05); // 肩膀内收
  E('neck', 0.1, 0, 0); E('head', 0.24, -0.08, 0.06);               // 低头、视线往下、略侧
  const s = Math.SQRT1_2;
  aim('upper_arm_r', new THREE.Vector3(-s, -s, 0), new THREE.Vector3(-0.27, -1, 0.05)); E('lower_arm_r', -0.1, 0, 0.06);   // 手臂要略张开才能落在宽大的雨衣外面
  aim('upper_arm_l', new THREE.Vector3(s, -s, 0), new THREE.Vector3(0.24, -1, 0.16)); E('lower_arm_l', -0.5, 0.1, 0);
  for (const f of ['index', 'middle', 'ring', 'pinky']) { E(`${f}_01_r`, 0, 0, 1.0); E(`${f}_02_r`, 0, 0, 1.1); E(`${f}_03_r`, 0, 0, 0.7); E(`${f}_01_l`, 0, 0, -0.35); E(`${f}_02_l`, 0, 0, -0.4); }
  E('thumb_01_r', 0.35, 0, 0.25); E('thumb_02_r', 0, 0, 0.4);
  E('hair_ponytail_01', 0.15, 0, 0);
}

const ktx2 = new KTX2Loader().setTranscoderPath('/three/examples/jsm/libs/basis/').detectSupport(renderer);
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).setKTX2Loader(ktx2);
const load = (u) => new Promise((ok, err) => loader.load(u, (g) => ok(g.scene), undefined, err));
const L = await (await fetch('/source/env/s1-layout.json')).json();
const place = (o, pl) => { o.position.set(...pl.translation); o.rotation.order = 'YXZ'; o.rotation.y = pl.rotationY ?? 0; if (pl.rotationXDeg) o.rotation.x = pl.rotationXDeg * Math.PI / 180; if (pl.rotationZDeg) o.rotation.z = pl.rotationZDeg * Math.PI / 180; };
const labels = [];
const label = (txt, p) => labels.push([txt, new THREE.Vector3(...p)]);

try {
  const cam = new THREE.PerspectiveCamera(40, W / H, 0.1, 3000);
  const look = (p, t, fov = 40) => { cam.position.set(...p); cam.lookAt(...t); cam.fov = fov; cam.updateProjectionMatrix(); };
  let terrain = null;
  if (view === 'assets' || view === 'rocks') {
    const gp = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: '#6B7279', roughness: 0.95 }));
    gp.rotation.x = -Math.PI / 2; gp.receiveShadow = true; scene.add(gp); U.uWet.value = -5;
    const row = [['env-rock-shore-a', -9, -2], ['env-rock-shore-b', -7.2, -2], ['env-rock-shore-c', -5.2, -2], ['env-rock-shore-d', -3, -2], ['env-rock-shore-e', -0.8, -2.5], ['env-rock-shore-f', 3.4, -3.2]];
    for (const [n, x, z] of row) { const o = prepare(await load(`/models/env/${n}.glb`)); o.position.set(x, 0, z); scene.add(o); label(n.replace('env-rock-shore-', 'rock '), [x, ({ e: 3.6, f: 2.6 })[n.at(-1)] ?? 1.6, z]); }
    const b1 = prepare(await load('/models/props/prop-boat-rowboat.glb')); b1.position.set(-6.5, 0, 5); b1.rotation.y = 1.2; scene.add(b1); label('prop-boat-rowboat', [-6.5, 1.2, 5]);
    const b2 = prepare(await load('/models/props/prop-boat-rowboat-sunken.glb')); b2.position.set(-2.4, 0, 5.4); b2.rotation.y = 0.9; scene.add(b2); label('…-sunken', [-2.4, 1.2, 5.4]);
    for (const [n, x, z] of [['env-net-rack-a', 2.3, 6.2], ['env-net-rack-b', 5.2, 7.8], ['env-fish-shed-ruin', 11.0, -1.6]]) {
      const o = prepare(await load(`/models/env/${n}.glb`)); const pl = L.nodes[n]; o.position.set(x, -pl.translation[1], z); scene.add(o);
      // 这几件按世界高度建模：减去它们在原址的地面高度
      const bb = new THREE.Box3().setFromObject(o); o.position.y -= bb.min.y; label(n, [x, bb.max.y - bb.min.y + 0.4 + (n.includes('shed') ? 0 : 0), z]);
    }
    const sil = prepare(await load('/models/env/env-lighthouse-silhouette-far.glb')); sil.scale.setScalar(0.12); sil.position.set(14.5, 0, 4); scene.add(sil); label('lighthouse-silhouette ×0.12', [14.5, 4.2, 4]);
    if (view === 'rocks') { look([-3.2, 3.4, 4.6], [-3.0, 0.55, -2.4], 46); labels.length = 0; for (const [n, x, z] of row) label(n.replace('env-rock-shore-', 'rock '), [x, ({ e: 2.0, f: 1.5 })[n.at(-1)] ?? 0.9, z]); }
    else look([1.5, 7.5, 20], [1.5, 0.6, 1.5], 38);
    document.getElementById('cap').textContent = view === 'rocks' ? '018 礁石 a–f 近景（LOD0）' : '018 资产一览（LOD0，中性灯光，无雾）';
  } else {
    // ---- 场景大件
    for (const [n, pl] of Object.entries(L.nodes)) {
      if (!pl.file || n.startsWith('env-rock-shore-')) continue;
      const o = prepare(await load(`/${pl.file.replace(/^models\//, 'models/')}`), { cast: !n.includes('tidal-flat') });
      if (n === 'env-lighthouse-silhouette-far') {
        for (const inst of L.silhouettes ?? pl.instances) { const c = o.clone(); c.position.set(...inst.translation); c.rotation.y = inst.rotationY; c.scale.setScalar(inst.scale); scene.add(c); }
        continue;
      }
      place(o, pl);
      // 020/S1 统一：插槽实例（主灯塔岛的 lighthouse-ch1-socket 挂 020 env-lighthouse-ch1，1.0 比例；预览用 previewLod，?towerLod= 可覆盖）
      for (const si of pl.socketInstances ?? []) {
        const sock = o.getObjectByName(si.socket); if (!sock) { console.warn('socket missing', si.socket); continue; }
        const t = prepare(await load(`/${si.file}`), { lod: Q.has('towerLod') ? +Q.get('towerLod') : si.previewLod ?? 2 });
        t.scale.setScalar(si.scale ?? 1); sock.add(t);
      }
      // 018 第二部分：fogLayer = mid（主灯塔岛）→ 用更低的雾密度（extras.fogDensityHint，默认 0.0045），岩石再压暗一点，读成亮雾前的深色剪影
      { let mid = null; o.traverse((q) => { if (!mid && q.userData?.fogLayer === 'mid') mid = q.userData; }); if (mid) applyMidFog(o, (Q.has('fogHint') ? +Q.get('fogHint') : null) ?? (ATMO ? AT.P.s1.fogDensityHint.mid[AT.presetName] : null) ?? mid.fogDensityHint ?? 0.0045); }   // 028：按预设取 fogDensityHint
      if (n === 'env-tidal-flat-s1') terrain = o;
      if (n === 'prop-boat-rowboat') o.userData.boat = true;
      scene.add(o);
    }
    // ---- 礁石实例（InstancedMesh，同一 GLB 单材质）
    const byRock = {}, foot = {};
    for (const q of L.instances) (byRock[q.rock] ??= []).push(q);
    for (const [k, list] of Object.entries(byRock)) {
      const g = prepare(await load(`/models/env/env-rock-shore-${k}.glb`));
      const mesh = g.getObjectByName(`env-rock-shore-${k}_lod0`);
      { mesh.geometry.computeBoundingBox(); mesh.updateMatrix(); const bb = mesh.geometry.boundingBox.clone().applyMatrix4(mesh.matrix); foot[k] = [bb.max.x - bb.min.x, bb.max.z - bb.min.z]; }
      // 018 第二部分：涨潮外礁在浪溅区，整块按湿石处理（湿线上移 1.2 m、湿色 0.6）→ 读成深色礁带
      const splash = mesh.material.clone(); splash.userData = { ...mesh.material.userData, wetDarken: 0.6, wetOffset: 1.2 }; patchMaterial(splash, splash.userData);
      for (const [sub, mat] of [[list.filter((q) => q.role !== 'dressing-hightide'), mesh.material], [list.filter((q) => q.role === 'dressing-hightide'), splash]]) {
      if (!sub.length) continue;
      const im = new THREE.InstancedMesh(mesh.geometry, mat, sub.length);
      const m4 = new THREE.Matrix4(); mesh.updateMatrix();
      sub.forEach((q, i) => im.setMatrixAt(i, m4.compose(new THREE.Vector3(...q.translation), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, q.rotationY, 0)), new THREE.Vector3(...q.scale)).multiply(mesh.matrix)));  // 量化后 lod 节点自带 平移/缩放（KHR_mesh_quantization），实例矩阵必须乘上它
      im.castShadow = im.receiveShadow = true; scene.add(im);
      }
    }
    // ---- 018 第二部分：涨潮时外侧礁带的水线白沫（预览示意；正式效果交给水面/VFX）
    if (TIDE > 1.0) {
      const foamTex = (() => { const N = 256, c = document.createElement('canvas'); c.width = c.height = N; const x = c.getContext('2d'); const img = x.createImageData(N, N);
        const hh = (i, j) => { const s = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return s - Math.floor(s); };
        const nn = (u, v) => { const i = Math.floor(u), j = Math.floor(v), f = u - i, g = v - j, a = hh(i, j), b = hh(i + 1, j), c2 = hh(i, j + 1), d = hh(i + 1, j + 1), sf = f * f * (3 - 2 * f), sg = g * g * (3 - 2 * g); return a + (b - a) * sf + (c2 - a) * sg + (a - b - c2 + d) * sf * sg; };
        for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) { const u = i / N * 2 - 1, v = j / N * 2 - 1, r = Math.hypot(u, v);
          const ring = Math.exp(-(((r - 0.62) / 0.18) ** 2)) + 0.6 * Math.exp(-(((r - 0.86) / 0.07) ** 2));
          let n = 0, amp = 0.5, f = 1; for (let o = 0; o < 4; o++) { n += amp * nn(i / 14 * f, j / 14 * f); amp *= 0.5; f *= 2; }
          const a = Math.max(0, Math.min(1, ring * (n - 0.32) * 2.6)) * (r < 1 ? 1 : 0); const k = (j * N + i) * 4; img.data[k] = 226; img.data[k + 1] = 232; img.data[k + 2] = 234; img.data[k + 3] = a * 255; }

      const hi = L.instances.filter((q) => q.role === 'dressing-hightide' && q.rock !== 'e');
